<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo... - Data Voices</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #667eea;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            margin-top: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">DV</div>
        <h2>Data Voices</h2>
        <div class="spinner"></div>
        <p class="message">Redirigiendo...</p>
        <p style="font-size: 0.9em; opacity: 0.7;">Si no eres redirigido automáticamente, <a href="/" style="color: white;">haz clic aquí</a></p>
    </div>

    <script>
        // SPA routing fix for static hosting
        (function() {
            // Get the current path that caused the 404
            var pathname = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;
            
            // Don't redirect if we're already at the home page
            if (pathname === '/' || pathname === '/index.html') {
                window.location.replace('/');
                return;
            }
            
            // Store the intended path for React Router to pick up
            var redirectPath = pathname + search + hash;
            
            // Redirect to index.html with the path information
            // React Router will handle the routing once the app loads
            var newUrl = '/' + '?redirect=' + encodeURIComponent(redirectPath);
            
            // Add a small delay to show the loading message
            setTimeout(function() {
                window.location.replace(newUrl);
            }, 1000);
            
            // Fallback: redirect immediately if replace doesn't work
            setTimeout(function() {
                window.location.href = '/';
            }, 3000);
        })();
    </script>
</body>
</html>
